name: ci
permissions:
  contents: read
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: dtolnay/rust-toolchain@stable
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - name: Resolve one fresh dependency snapshot
      run: 'cargo update

        rustc --version > resolver.txt

        cargo --version >> resolver.txt

        date -u +%FT%TZ >> resolver.txt

        sha256sum Cargo.lock >> resolver.txt'
    - name: Resolve real public accounting fixture source once
      run: 'git clone --depth 1 https://github.com/corbet-libs/cblc.git fixture-source

        git -C fixture-source rev-parse HEAD > fixture-source.txt

        cd fixture-source

        npm install --package-lock-only --ignore-scripts --no-audit --no-fund

        git archive HEAD > ../fixture-source.tar

        cp package-lock.json ../fixture-package-lock.json'
    - uses: actions/upload-artifact@v4
      with:
        name: resolved-lock
        path: 'Cargo.lock

          resolver.txt

          fixture-source.tar

          fixture-source.txt

          fixture-package-lock.json'
        retention-days: 7
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-deny
    - run: cargo deny --locked check advisories licenses
    needs:
    - resolve
  dependency-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - run: python3 .github/check-first-party.py
    needs:
    - resolve
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: dtolnay/rust-toolchain@stable
      with:
        toolchain: stable
        components: rustfmt, clippy
    - uses: Swatinem/rust-cache@v2
    - run: 'rustc --version

        cargo fmt --check || { cargo fmt; git diff > formatting.patch; exit 1; }'
    - run: cargo clippy --locked --all-targets -- -D warnings
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - &id001
      run: 'mkdir -p fixture-source

        tar -xf fixture-source.tar -C fixture-source

        cp fixture-package-lock.json fixture-source/package-lock.json'
    - &id002
      run: npm ci --ignore-scripts --no-audit --no-fund
      working-directory: fixture-source
    - uses: actions/cache@v4
      id: proofs
      with:
        path: fixture-source/.proof-test
        key: public-account-proofs-v1-${{ runner.os }}-${{ hashFiles('fixture-source.tar', 'fixture-package-lock.json') }}
    - name: Generate real Noir account proofs with the maintained holder
      if: steps.proofs.outputs.cache-hit != 'true'
      run: node tests/real-proof.mjs
      working-directory: fixture-source
    - run: node --input-type=module -e 'import {readFileSync,writeFileSync} from "node:fs"; import {resolve} from "node:path"; const p=resolve("fixture-source/.proof-test/config.json"); const c=JSON.parse(readFileSync(p));c.directory=resolve("fixture-source/.proof-test");writeFileSync(p,JSON.stringify(c));'
    - run: cargo test --locked
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: formatting
        path: formatting.patch
    - uses: actions/upload-artifact@v4
      with:
        name: public-proofs
        path: fixture-source/.proof-test/
        include-hidden-files: true
        if-no-files-found: error
        retention-days: 7
    needs:
    - resolve
    env: &id003
      CVFY_FIXTURE_SOURCE: ${{ github.workspace }}/fixture-source
  coverage:
    needs:
    - resolve
    - check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ github.event.pull_request.head.sha || github.sha }}
        persist-credentials: false
    - uses: actions/download-artifact@v4
      with:
        name: resolved-lock
    - uses: actions/setup-node@v4
      with:
        node-version: 24
    - *id001
    - *id002
    - uses: actions/download-artifact@v4
      with:
        name: public-proofs
        path: fixture-source/.proof-test
    - run: 'node --input-type=module -e ''import {readFileSync,writeFileSync} from
        "node:fs"; import {resolve} from "node:path"; const p=resolve("fixture-source/.proof-test/config.json");
        const c=JSON.parse(readFileSync(p));c.directory=resolve("fixture-source/.proof-test");writeFileSync(p,JSON.stringify(c));'' '
    - uses: dtolnay/rust-toolchain@nightly
      with:
        components: llvm-tools-preview
    - uses: Swatinem/rust-cache@v2
      with:
        prefix-key: coverage
    - uses: taiki-e/install-action@v2
      with:
        tool: cargo-llvm-cov
    - run: 'rustc --version

        cargo llvm-cov --version'
    - name: Measure real native round trips and failure paths
      run: cargo llvm-cov --locked --workspace --all-features --branch --no-cfg-coverage
        --no-cfg-coverage-nightly --ignore-filename-regex '/tests/' --json --output-path
        coverage.json
    - name: Retain source coverage diagnostics from the same execution
      run: cargo llvm-cov report --branch --ignore-filename-regex '/tests/' --lcov
        --output-path coverage.lcov
    - name: Retain independent annotated source inventory
      run: cargo llvm-cov report --branch --ignore-filename-regex '/tests/' --text --output-path coverage.txt
    - name: Require complete source line and branch coverage
      run: |
        python3 .github/test-source-coverage.py
        python3 .github/check-source-coverage.py coverage.lcov coverage.json coverage.txt
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: coverage
        path: 'coverage.json

          Cargo.lock

          resolver.txt

          coverage.lcov

          coverage.txt'
        retention-days: 7
    env: *id003
'on':
  push:
    branches:
    - main
    - ci/**
  pull_request: null
  workflow_dispatch: null
env:
  CARGO_BUILD_JOBS: 2
  CARGO_TERM_COLOR: always
