schema = 1
project = "cvfy"

[checks.verify]
# This integration check regenerates a fresh upstream proof fixture.
# Keep every substantive gate; avoid reusing a cached fixture execution.
cache = false
kind = "commands"
commands = [["bash", ".ci/verify.sh"]]
cache_tools = [["rustc", "-vV"], ["cargo", "--version"], ["node", "--version"], ["npm", "--version"], ["python3", "--version"], ["rustup", "run", "nightly", "rustc", "-vV"], ["rustup", "run", "nightly", "cargo", "llvm-cov", "--version"]]
cache_env = ["CVFY_FIXTURE_HEAD", "CVFY_FIXTURE_LOCK_SHA", "BB_LIB_DIR", "BB_NATIVE_RUSTFLAGS"]
cache_outputs = ["coverage.json", "coverage.lcov", "coverage.txt"]

[checks.advisories]
kind = "commands"
commands = [["cargo", "deny", "--locked", "check", "advisories", "licenses"]]

[render]
tool_revision = "bd9aff07073185fb0a3503bab331aedefb6d8fd2"
tool_sha256 = "38c0eadf2a2adb406f83c7d4892bc01a0a10b95671e1e671358e43a257bb5d23"

[jobs.verify]
scheduler = "forgejo"
runs_on = "heavy"
events = ["push", "manual"]
checks = ["verify", "advisories"]
workflow = "ci"
command = ["bash", ".ci/run-cached.sh"]


[jobs.verify-pr]
scheduler = "forgejo"
runs_on = "light"
events = ["pull_request"]
checks = ["verify", "advisories"]
workflow = "pr"
command = ["bash", ".ci/run-cached.sh"]

[checks.resolve-dependencies]
kind = "commands"
commands = [["bash", ".ci/resolve-dependencies.sh"]]
cache = false
cache_outputs = ["Cargo.lock"]

[jobs.resolve-dependencies]
scheduler = "forgejo"
runs_on = "heavy"
events = ["manual"]
checks = ["resolve-dependencies"]
workflow = "resolve"
command = ["bash", ".ci/run-cached.sh"]
