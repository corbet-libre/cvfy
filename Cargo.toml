[package]
name = "cvfy"
version = "0.0.0"
edition = "2024"
rust-version = "1.95"
description = "Verifier for zero-knowledge accounting: checks a proof against a policy, pure and without trace"
license = "LGPL-3.0-only WITH LGPL-3.0-linking-exception"
repository = "https://git.corbet.ch/corbet-libre/cvfy.git"
readme = "README.md"
publish = false
include = ["Cargo.toml", "src/**", "README.md", "LICENSE", "LICENSE.md", "LICENSES/LGPL-3.0-only.txt", "LICENSES/LGPL-3.0-linking-exception.txt", "LICENSES/GPL-3.0-only.txt"]

[lib]
crate-type = ["rlib"]

[features]
test-worker = []
instrumented-worker = []

[[bin]]
name = "cvfy-refusal-worker"
path = "tests/support/native_worker.rs"
required-features = ["test-worker"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dependencies]
czkp = { git = "https://git.corbet.ch/corbet-libre/czkp.git", branch = "main", features = ["native"] }
data-encoding = "2.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
czkp = { git = "https://git.corbet.ch/corbet-libre/czkp.git", branch = "main", features = ["native-worker"] }
